<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050b18"/>
      <stop offset="55%" stop-color="#09152b"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="46%" r="48%">
      <stop offset="0%" stop-color="rgba(0,240,255,0.38)"/>
      <stop offset="55%" stop-color="rgba(0,255,157,0.14)"/>
      <stop offset="100%" stop-color="rgba(0,240,255,0)"/>
    </radialGradient>
    <linearGradient id="cyanEm" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#00ff9d"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect width="512" height="512" rx="112" fill="url(#glow)"/>
  <rect x="26" y="26" width="460" height="460" rx="92" fill="none" stroke="rgba(56,189,248,0.34)" stroke-width="5"/>
  <!-- Outer neural diamond -->
  <polygon points="256,88 424,256 256,424 88,256" fill="rgba(0,240,255,0.08)" stroke="url(#cyanEm)" stroke-width="18" stroke-linejoin="round"/>
  <!-- Inner lattice lines -->
  <line x1="256" y1="138" x2="256" y2="374" stroke="rgba(0,240,255,0.45)" stroke-width="8"/>
  <line x1="138" y1="256" x2="374" y2="256" stroke="rgba(0,255,157,0.45)" stroke-width="8"/>
  <!-- Center core node -->
  <polygon points="256,184 328,256 256,328 184,256" fill="url(#cyanEm)"/>
  <circle cx="256" cy="256" r="24" fill="#030712"/>
  <circle cx="256" cy="256" r="10" fill="#00ff9d"/>
  <!-- 4 Cardinal fleet nodes -->
  <circle cx="256" cy="110" r="18" fill="#00f0ff"/>
  <circle cx="402" cy="256" r="18" fill="#00ff9d"/>
  <circle cx="256" cy="402" r="18" fill="#a855f7"/>
  <circle cx="110" cy="256" r="18" fill="#38bdf8"/>
</svg>
